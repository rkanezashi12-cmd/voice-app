[project]
name = "meeting-notes"
version = "0.1.0"
description = "商談の文字起こし・要約を Zoho CRM に蓄積するバックエンド（Cloud Run）"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "desktop", "widgets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "E501",   # コードの折り返しは ruff format に任せる（日本語のコメントは全角2文字幅で数えられるため）
    "RUF001", # 全角記号を含む日本語文字列を許可する
    "RUF002",
    "RUF003",
    "S101",   # tests で assert を使う
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/crm_setup.py" = ["S310"]  # 接続先は https://*.zoho.{dc} に固定
"scripts/recall_check.py" = ["S310"]  # 接続先は https:// だけ（RECALL_BASE_URL を確かめている）

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
