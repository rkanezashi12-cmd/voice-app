# Cloud Run の環境変数（gcloud run deploy --env-vars-file で渡す）。秘密情報そのものは書かない。
# 使い方: cp config/env.example.yaml config/env.dev.local.yaml して値を埋める（*.local.* は git に入らない）
DRY_RUN: "true"
CRM_TEST_RECORDS: "true"
LOG_LEVEL: "INFO"
GCP_PROJECT_ID: "voice-ai-510014"
GCS_BUCKET: "voice-ai-510014-meeting-audio"
SIGNING_SERVICE_ACCOUNT: "meeting-notes-run@voice-ai-510014.iam.gserviceaccount.com"
# リージョン シークレットの場合は projects/…/locations/asia-northeast1/secrets/…/versions/latest の形にする
RECORDING_TOKEN_SECRET_REF: "sm:projects/voice-ai-510014/secrets/recording-token-secret/versions/latest"
# 初回デプロイ後に確定する（gcloud run services describe で確認）
SERVICE_URL: "https://meeting-notes-xxxxxxxxxx-an.a.run.app"
# 録音テストだけなら api_key だけでよい。全体の例は config/clients.example.json
CLIENTS_CONFIG_JSON: '{"clients":{"default":{"api_key":"sm:projects/voice-ai-510014/secrets/backend-api-key/versions/latest"}}}'
